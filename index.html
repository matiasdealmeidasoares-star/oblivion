<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBVILION</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    
    header {
      width: 100%;
      text-align: center;
      padding-top: 15px;
    }

    h1 {
      color: #530000;
      font-size: 1.8rem;
      letter-spacing: 2px;
      font-weight: bold;
      text-transform: uppercase;
    }

    hr {
      border: none;
      border-top: 1px solid #ffffff;
      width: 100%;
      margin-top: 15px;
    }

    
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #cccccc;
      margin-bottom: 25px;
    }

    .logo-container img {
      max-width: 320px;
      width: 100%;
      height: auto;
      display: block;
    }

    
    footer {
      margin-top: 25px;
      font-size: 0.95rem;
      color: #cccccc;
    }
  </style>
</head>
<body>

  <header>
    <h1>OBVILION AURUDA 67</h1>
    <hr>
  </header>

  <main>
    <div class="subtitle">se fuderu</div>
    
    <div class="logo-container">
    
      <img src="https://github.com/matiasdealmeidasoares-star/oblivion/commit/b08807e700237c4a35a2a5fd8c069c069138821a" alt="OBVILION Logo">
    </div>

    <footer>
      hacked by OBLIVION with PsxX
    </footer>
  </main>

</body>
</html>
